[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwix-assessment"
version = "1.0.0"
description = "Darwix AI - AI Engineer assessment: grounded voice agent, production KB, native-language bots, live call nudges"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
scrape = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
